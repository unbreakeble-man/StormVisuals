<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Storm · HUD — Watermark & Potions</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="hud.css">
</head>
<body>
  <main class="world" aria-label="Макет HUD на фоне Minecraft">
    <header class="watermark" aria-label="Storm, пример показателей: 144 FPS, 32 миллисекунды, 20 TPS">
      <div class="brand">
        <img class="logo" src="assets/storm-watermark.png" alt="Логотип Storm" width="28" height="28">
        <span>Storm</span>
      </div>
      <span class="divider" aria-hidden="true"></span>
      <div class="metric" title="Частота кадров — пример">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4M6 12l3-3 3 3 5-5"/></svg>
        <span class="value">144</span><span class="unit">fps</span>
      </div>
      <span class="divider" aria-hidden="true"></span>
      <div class="metric" title="Задержка соединения — пример">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19v-3M9 19v-7M14 19V8M19 19V4"/></svg>
        <span class="value">32</span><span class="unit">ms</span>
      </div>
      <span class="divider" aria-hidden="true"></span>
      <div class="metric" title="Частота тиков сервера — пример">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8a9 9 0 0 1 15-2l2 2M21 3v5h-5M20 16a9 9 0 0 1-15 2l-2-2M3 21v-5h5"/><path d="m9 12 2 2 4-4"/></svg>
        <span class="value">20</span><span class="unit">tps</span>
      </div>
    </header>
    <section class="potions" aria-label="Potions — пример активных эффектов">
      <header class="potions-header">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6M10 3v6l-5 8a2.5 2.5 0 0 0 2 4h10a2.5 2.5 0 0 0 2-4l-5-8V3M8 14h8"/></svg>
        <h1>Potions</h1>
      </header>
      <ul class="effect-list">
        <li class="effect">
          <img src="assets/potions/speed.png" alt="" width="18" height="18">
          <span class="effect-name">Скорость <span class="effect-level">II</span></span>
          <time class="effect-time" datetime="PT3M24S">3:24</time>
        </li>
        <li class="effect">
          <img src="assets/potions/strength.png" alt="" width="18" height="18">
          <span class="effect-name">Сила <span class="effect-level">II</span></span>
          <time class="effect-time expiring" datetime="PT18S">0:18</time>
        </li>
        <li class="effect">
          <img src="assets/potions/fire_resistance.png" alt="" width="18" height="18">
          <span class="effect-name">Огнестойкость</span>
          <time class="effect-time" datetime="PT7M42S">7:42</time>
        </li>
      </ul>
    </section>
  </main>
</body>
</html>
