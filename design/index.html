<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>StormVisuals · Click GUI</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="bolt" viewBox="0 0 24 24"><path d="m13 2-9 12h7l-1 8 10-12h-7z"/></symbol>
    <symbol id="eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="world" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></symbol>
    <symbol id="utils" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2"/><circle cx="15" cy="17" r="2"/></symbol>
    <symbol id="keyboard" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M6 12h.01M10 12h.01M14 12h.01M18 12h.01M8 16h8"/></symbol>
    <symbol id="config" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v5h4M9 12h6M9 16h6"/></symbol>
    <symbol id="pin" viewBox="0 0 24 24"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 0 1 14 0Z"/><circle cx="12" cy="10" r="2.5"/></symbol>
    <symbol id="search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></symbol>
    <symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  </svg>
  <main class="gui" aria-label="StormVisuals Click GUI">
    <header class="header">
      <div class="brand"><svg class="icon brand-icon"><use href="#bolt"/></svg><span>StormVisuals</span></div>
      <label class="search"><svg class="icon"><use href="#search"/></svg><input type="search" placeholder="Поиск" aria-label="Поиск модулей" autocomplete="off" spellcheck="false"></label>
      <button class="close icon-button" aria-label="Закрыть"><svg class="icon"><use href="#close"/></svg></button>
    </header>
    <div class="body">
      <nav class="sidebar" aria-label="Разделы">
        <section class="nav-group"><h2>Визуал</h2>
          <button class="nav-item active" data-category="Render" aria-current="page"><svg class="icon"><use href="#eye"/></svg>Render</button>
          <button class="nav-item" data-category="World"><svg class="icon"><use href="#world"/></svg>World</button>
        </section>
        <section class="nav-group"><h2>Утилиты</h2>
          <button class="nav-item" data-category="Utils"><svg class="icon"><use href="#utils"/></svg>Utils</button>
          <button class="nav-item" data-category="Keybinds"><svg class="icon"><use href="#keyboard"/></svg>Keybinds</button>
        </section>
        <section class="nav-group"><h2>Прочее</h2>
          <button class="nav-item" data-category="Configs"><svg class="icon"><use href="#config"/></svg>Configs</button>
          <button class="nav-item" data-category="Waypoints"><svg class="icon"><use href="#pin"/></svg>Waypoints</button>
        </section>
      </nav>
      <section class="content" aria-label="Модули">
        <div class="columns"><div class="column"></div><div class="column"></div></div>
        <p class="empty" hidden>Нет модулей</p>
      </section>
    </div>
  </main>
  <button class="reopen" hidden>StormVisuals</button>
</body>
</html>
